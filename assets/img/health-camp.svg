<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 500" preserveAspectRatio="xMidYMid slice">
<style>
.flag{transform-box:fill-box;transform-origin:50% 0;animation:flap 3.2s ease-in-out infinite}
@keyframes flap{0%,100%{transform:rotate(-5deg) scaleY(.97)}50%{transform:rotate(5deg) scaleY(1)}}
.valance{transform-box:fill-box;transform-origin:50% 0;animation:valance 3.4s ease-in-out infinite}
@keyframes valance{0%,100%{transform:skewX(-2.5deg)}50%{transform:skewX(2.5deg) scaleY(.96)}}

.cuff{transform-box:fill-box;transform-origin:50% 100%;animation:cuff 8s infinite}
@keyframes cuff{0%{transform:scale(1,1);animation-timing-function:ease-out}22%{transform:scale(1.06,1.45);animation-timing-function:linear}62%{transform:scale(1,1)}100%{transform:scale(1,1)}}
.gauge{transform-box:fill-box;transform-origin:0 50%;animation:gauge 8s infinite}
@keyframes gauge{0%{transform:scaleX(.02);animation-timing-function:ease-out}22%{transform:scaleX(1);animation-timing-function:linear}62%{transform:scaleX(.05);opacity:1}64%,100%{transform:scaleX(.05);opacity:0}}
.reading{opacity:0;animation:reading 8s infinite}
@keyframes reading{0%,63%{opacity:0}66%,96%{opacity:1}100%{opacity:0}}
.greading{opacity:0;animation:greading 7s infinite}
@keyframes greading{0%,45%{opacity:0}48%,95%{opacity:1}100%{opacity:0}}
.gwait circle{animation:gwait 7s infinite}
.gwait circle:nth-child(2){animation-name:gwait2}.gwait circle:nth-child(3){animation-name:gwait3}
@keyframes gwait{0%,4%,12%,20%,28%,36%{opacity:1}8%,16%,24%,32%,40%{opacity:.25}45%,100%{opacity:0}}
@keyframes gwait2{0%,8%,16%,24%,32%,40%{opacity:1}4%,12%,20%,28%,36%{opacity:.25}45%,100%{opacity:0}}
@keyframes gwait3{0%,6%,14%,22%,30%,38%{opacity:1}2%,10%,18%,26%,34%{opacity:.25}45%,100%{opacity:0}}
.drop{transform-box:fill-box;transform-origin:50% 100%;animation:drop 7s ease-in-out infinite}
@keyframes drop{0%,100%{transform:scale(1)}40%{transform:scale(1.06)}}
.idle{transform-box:fill-box;transform-origin:50% 100%;animation:idle 4.5s ease-in-out infinite}
@keyframes idle{0%,100%{transform:rotate(-.8deg)}50%{transform:rotate(.8deg) translateY(-1px)}}
.nod{transform-box:fill-box;transform-origin:50% 100%;animation:nod 6s ease-in-out infinite}
@keyframes nod{0%,70%,100%{transform:rotate(0)}76%{transform:rotate(5deg)}82%{transform:rotate(0)}88%{transform:rotate(4deg)}94%{transform:rotate(0)}}
.heart{transform-box:fill-box;transform-origin:center;animation:beat 1.1s infinite}
@keyframes beat{0%{transform:scale(1)}12%{transform:scale(1.07)}24%{transform:scale(1.01)}36%{transform:scale(1.05)}60%,100%{transform:scale(1)}}
.ecg{stroke-dasharray:420;animation:ecg 2.2s linear infinite}
@keyframes ecg{0%{stroke-dashoffset:420}60%,100%{stroke-dashoffset:0}}
.ring{transform-box:fill-box;transform-origin:center;animation:ring 3s ease-out infinite}
@keyframes ring{0%{transform:scale(1);opacity:.5}100%{transform:scale(1.35);opacity:0}}
.tree{transform-box:fill-box;transform-origin:50% 100%;animation:sway 6s ease-in-out infinite}.tree.t2{animation-delay:-3s}
@keyframes sway{0%,100%{transform:rotate(-1deg)}50%{transform:rotate(1deg)}}
.walker{animation:walk 14s infinite}
@keyframes walk{0%{transform:translateX(300px);animation-timing-function:linear}27%{transform:translateX(8px);animation-timing-function:ease-out}30%{transform:translateX(0)}62%{transform:translateX(0);animation-timing-function:ease-in}65%{transform:translateX(10px);animation-timing-function:linear}100%{transform:translateX(330px)}}
.walker .bob{animation:wbob 14s infinite}
.walker .legA,.walker .legB{transform-box:fill-box;transform-origin:50% 0;animation:legA 14s infinite}
.walker .legB{animation-name:legB}
@keyframes legA{0.00%{transform:rotate(0deg)}3.75%{transform:rotate(14deg)}7.50%{transform:rotate(-14deg)}11.25%{transform:rotate(14deg)}15.00%{transform:rotate(-14deg)}18.75%{transform:rotate(14deg)}22.50%{transform:rotate(-14deg)}26.25%{transform:rotate(14deg)}30.00%{transform:rotate(0deg)}62.00%{transform:rotate(0deg)}65.80%{transform:rotate(14deg)}69.60%{transform:rotate(-14deg)}73.40%{transform:rotate(14deg)}77.20%{transform:rotate(-14deg)}81.00%{transform:rotate(14deg)}84.80%{transform:rotate(-14deg)}88.60%{transform:rotate(14deg)}92.40%{transform:rotate(-14deg)}96.20%{transform:rotate(14deg)}100.00%{transform:rotate(0deg)}}
@keyframes legB{0.00%{transform:rotate(0deg)}3.75%{transform:rotate(-14deg)}7.50%{transform:rotate(14deg)}11.25%{transform:rotate(-14deg)}15.00%{transform:rotate(14deg)}18.75%{transform:rotate(-14deg)}22.50%{transform:rotate(14deg)}26.25%{transform:rotate(-14deg)}30.00%{transform:rotate(0deg)}62.00%{transform:rotate(0deg)}65.80%{transform:rotate(-14deg)}69.60%{transform:rotate(14deg)}73.40%{transform:rotate(-14deg)}77.20%{transform:rotate(14deg)}81.00%{transform:rotate(-14deg)}84.80%{transform:rotate(14deg)}88.60%{transform:rotate(-14deg)}92.40%{transform:rotate(14deg)}96.20%{transform:rotate(-14deg)}100.00%{transform:rotate(0deg)}}
@media (prefers-reduced-motion:reduce){*{animation:none!important}.reading,.greading{opacity:1}.gwait{display:none}}
@keyframes wbob{0.00%{transform:translateY(0px)}3.75%{transform:translateY(-3px)}7.50%{transform:translateY(0px)}11.25%{transform:translateY(-3px)}15.00%{transform:translateY(0px)}18.75%{transform:translateY(-3px)}22.50%{transform:translateY(0px)}26.25%{transform:translateY(-3px)}30.00%{transform:translateY(0px)}62.00%{transform:translateY(0px)}65.80%{transform:translateY(-3px)}69.60%{transform:translateY(0px)}73.40%{transform:translateY(-3px)}77.20%{transform:translateY(0px)}81.00%{transform:translateY(-3px)}84.80%{transform:translateY(0px)}88.60%{transform:translateY(-3px)}92.40%{transform:translateY(0px)}96.20%{transform:translateY(-3px)}100.00%{transform:translateY(0px)}}
</style>
