<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 720" preserveAspectRatio="xMidYMid slice">
<defs><linearGradient id="sky" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#D7E8F3"/><stop offset="1" stop-color="#F7FAFC"/></linearGradient><clipPath id="signClip"><rect x="420" y="132" width="380" height="64" rx="12"/></clipPath><linearGradient id="gl" x1="0" x2="1"><stop offset="0" stop-color="#fff" stop-opacity="0"/><stop offset=".5" stop-color="#fff" stop-opacity=".35"/><stop offset="1" stop-color="#fff" stop-opacity="0"/></linearGradient></defs>
<style>
.cloud{animation:drift 60s linear infinite}
.cloud.c2{animation-duration:85s;animation-delay:-40s}
@keyframes drift{from{transform:translateX(-300px)}to{transform:translateX(1500px)}}
.sun{transform-box:fill-box;transform-origin:center;animation:sun 6s ease-in-out infinite}
@keyframes sun{50%{transform:scale(1.08);opacity:.85}}
.sign{animation:drop .9s cubic-bezier(.2,.9,.3,1.2) both}
@keyframes drop{from{transform:translateY(-60px);opacity:0}}
.shine{animation:shine 5s ease-in-out 1.2s infinite}
@keyframes shine{0%{transform:translateX(-160px)}35%,100%{transform:translateX(480px)}}
.dot{transform-box:fill-box;transform-origin:center;animation:pulse 1.6s ease-in-out infinite}
@keyframes pulse{50%{transform:scale(1.5);opacity:.6}}
.warm{animation:twinkle 7s ease-in-out infinite}
.warm.w2{animation-delay:-2s}.warm.w3{animation-delay:-4.5s}
@keyframes twinkle{0%,60%,100%{fill:#FFF1D6}70%,90%{fill:#FFD98A}}
.tree{transform-box:fill-box;transform-origin:50% 100%;animation:sway 5s ease-in-out infinite}
.tree.t2{animation-delay:-1.6s}.tree.t3{animation-delay:-3.1s}
@keyframes sway{0%,100%{transform:rotate(-1.5deg)}50%{transform:rotate(1.5deg)}}
.doorL,.doorR{animation:doorL 10s ease-in-out infinite}
.doorR{animation-name:doorR}
@keyframes doorL{0%,38%,78%,100%{transform:translateX(0)}46%,70%{transform:translateX(-62px)}}
@keyframes doorR{0%,38%,78%,100%{transform:translateX(0)}46%,70%{transform:translateX(62px)}}
.walker{animation:walk 10s linear infinite}
@keyframes walk{0%{transform:translateX(-40px);opacity:0}6%{opacity:1}52%{transform:translateX(140px) scale(1);opacity:1}62%{transform:translateX(140px);opacity:0}100%{transform:translateX(140px);opacity:0}}
.walker .bob{animation:bob .5s ease-in-out infinite}
@keyframes bob{50%{transform:translateY(-3px)}}
.legA,.legB{transform-box:fill-box;transform-origin:50% 0;animation:leg .5s ease-in-out infinite alternate}
.legB{animation-direction:alternate-reverse}
@keyframes leg{from{transform:rotate(14deg)}to{transform:rotate(-14deg)}}
.idle{animation:idle 3.2s ease-in-out infinite}
.idle.i2{animation-delay:-1s}.idle.i3{animation-delay:-2.2s}
@keyframes idle{50%{transform:translateY(-2px)}}
.kid{animation:hop 2.4s ease-in-out infinite}
@keyframes hop{0%,70%,100%{transform:translateY(0)}80%{transform:translateY(-10px)}90%{transform:translateY(0)}}
.wave{transform-box:fill-box;transform-origin:50% 10%;animation:wave 4s ease-in-out infinite}
@keyframes wave{0%,50%,92%,100%{transform:rotate(0)}58%,72%{transform:rotate(-150deg)}65%,79%{transform:rotate(-120deg)}86%{transform:rotate(-150deg)}}
.amb{animation:drive 14s linear 2s infinite}
@keyframes drive{0%{transform:translateX(0)}45%,100%{transform:translateX(1500px)}}
.siren{animation:siren .6s steps(1) infinite}
@keyframes siren{50%{fill:#0EA5E9}}
.wheel{transform-box:fill-box;transform-origin:center;animation:spin .5s linear infinite}
@keyframes spin{to{transform:rotate(360deg)}}
@media (prefers-reduced-motion:reduce){*{animation:none!important}}
</style>
