<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link rel="stylesheet" href="vendor/fonts/noto-sans-bengali.css">
<style>
*{box-sizing:border-box}
html,body{margin:0;height:100%;background:#011B2E;overflow:hidden}
a{color:#7CC8F0;text-decoration:none}
a:hover{color:#fff}
@keyframes tvTicker{from{transform:translateX(0)}to{transform:translateX(-50%)}}
@keyframes tvPulse{0%,100%{opacity:1}50%{opacity:.35}}
</style>
</helmet>
<div style="height:100vh;width:100vw;display:flex;flex-direction:column;background:#011B2E;color:#fff;font-family:'Noto Sans Bengali',sans-serif;overflow:hidden">
  <sc-if value="{{ offline }}" hint-placeholder-val="{{ false }}">
    <div style="flex:none;background:#FFB020;color:#1A1200;display:flex;align-items:center;justify-content:center;gap:1.4vw;padding:.9vh 2vw;font-size:clamp(14px,1.5vw,30px);font-weight:700">
      {{ pulseDot }}
      <span>{{ L.offline }}</span>
      <span style="font-weight:500">{{ L.lastUpd }}</span>
    </div>
  </sc-if>
  <header style="flex:none;display:flex;align-items:center;justify-content:space-between;gap:2vw;padding:2vh 2.4vw;border-bottom:1px solid #0B3B5E">
    <div style="display:flex;align-items:center;gap:1.2vw">
      <div role="img" aria-label="Popular Hospital" style="width:clamp(44px,4.4vw,88px);height:clamp(44px,4.4vw,88px);border-radius:14%;background:#02548A url('assets/logo/hospital-mark.svg') center/cover no-repeat;display:grid;place-items:center;font-weight:800;font-size:clamp(16px,1.6vw,32px)"></div>
      <div style="line-height:1.15">
        <div style="font-size:clamp(20px,2.2vw,44px);font-weight:700">{{ L.hosp }}</div>
        <div style="font-size:clamp(13px,1.2vw,24px);color:#7CC8F0">{{ L.queue }}</div>
      </div>
    </div>
    <div style="text-align:right;line-height:1.1">
      <div style="font-size:clamp(24px,3vw,60px);font-weight:700;font-variant-numeric:tabular-nums">{{ clock }}</div>
      <div style="font-size:clamp(12px,1.1vw,22px);color:#9FC3DA">{{ L.date }}</div>
    </div>
  </header>
  <main style="flex:1;min-height:0;display:grid;grid-template-columns:repeat(3,minmax(0,1fr));grid-template-rows:repeat(2,minmax(0,1fr));gap:1.4vw;padding:1.6vw 2.4vw;opacity:{{ dim }}">
    <sc-for list="{{ cards }}" as="c" hint-placeholder-count="6">
      <section style="min-height:0;background:#022A47;border:3px solid {{ c.bd }};border-radius:1.2vw;display:flex;flex-direction:column;overflow:hidden">
        <div style="display:flex;justify-content:space-between;align-items:center;gap:1vw;padding:1.2vh 1.4vw;background:#02375C">
          <div style="min-width:0;line-height:1.2">
            <div style="font-size:clamp(15px,1.45vw,30px);font-weight:700;white-space:nowrap;overflow:hidden;text-overflow:ellipsis">{{ c.nm }}</div>
            <div style="font-size:clamp(12px,1.1vw,22px);color:#9FC3DA;white-space:nowrap;overflow:hidden;text-overflow:ellipsis">{{ c.sub2 }}</div>
          </div>
          <div style="flex:none;text-align:center;background:#011B2E;border-radius:.6vw;padding:.5vh .9vw;line-height:1.1">
            <div style="font-size:clamp(10px,.85vw,17px);color:#7CC8F0">{{ L.room }}</div>
            <div style="font-size:clamp(20px,2.1vw,42px);font-weight:800">{{ c.room }}</div>
          </div>
        </div>
        <div style="flex:1;min-height:0;display:flex;flex-direction:column;justify-content:center;align-items:center;padding:1vh 1vw;line-height:1">
          <div style="font-size:clamp(12px,1.15vw,23px);font-weight:600;color:{{ c.labelC }};letter-spacing:.04em">{{ c.label }}</div>
          <div style="font-size:clamp(56px,8.6vw,180px);font-weight:800;color:{{ c.tokenC }};letter-spacing:.02em;margin:.6vh 0;font-variant-numeric:tabular-nums">{{ c.token }}</div>
          <div style="font-size:clamp(12px,1.1vw,22px);color:#C9DDEA;text-align:center">{{ c.sub }}</div>
        </div>
        <div style="flex:none;display:flex;align-items:center;gap:.8vw;padding:1.1vh 1.4vw;border-top:1px solid #0B3B5E">
          <span style="font-size:clamp(11px,1vw,20px);color:#9FC3DA;white-space:nowrap">{{ L.next }}</span>
          <div style="display:flex;gap:.6vw;flex:1;min-width:0">
            <sc-for list="{{ c.next }}" as="n" hint-placeholder-count="3"><span style="flex:1;text-align:center;background:#011B2E;border-radius:.5vw;padding:.5vh 0;font-size:clamp(16px,1.8vw,36px);font-weight:700">{{ n.t }}</span></sc-for>
            <sc-if value="{{ c.noNext }}" hint-placeholder-val="{{ false }}"><span style="font-size:clamp(11px,1vw,20px);color:#6E92AA">—</span></sc-if>
          </div>
        </div>
      </section>
    </sc-for>
  </main>
  <sc-if value="{{ showNotice }}" hint-placeholder-val="{{ true }}">
    <footer style="flex:none;display:flex;align-items:stretch;background:#02548A;height:clamp(40px,5.2vh,64px)">
      <div style="flex:none;display:flex;align-items:center;padding:0 1.6vw;background:#FF8000;color:#1A0C00;font-weight:800;font-size:clamp(13px,1.3vw,26px)">{{ L.notice }}</div>
      <div style="flex:1;min-width:0;overflow:hidden;display:flex;align-items:center">{{ ticker }}</div>
    </footer>
  </sc-if>
  
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props="{&quot;offline&quot;:{&quot;editor&quot;:&quot;boolean&quot;,&quot;default&quot;:false,&quot;tsType&quot;:&quot;boolean&quot;,&quot;section&quot;:&quot;States&quot;},&quot;showNotice&quot;:{&quot;editor&quot;:&quot;boolean&quot;,&quot;default&quot;:true,&quot;tsType&quot;:&quot;boolean&quot;,&quot;section&quot;:&quot;Display&quot;},&quot;autoAdvance&quot;:{&quot;editor&quot;:&quot;boolean&quot;,&quot;default&quot;:true,&quot;tsType&quot;:&quot;boolean&quot;,&quot;section&quot;:&quot;Display&quot;},&quot;noticeText&quot;:{&quot;editor&quot;:&quot;text&quot;,&quot;default&quot;:&quot;&quot;,&quot;tsType&quot;:&quot;string&quot;,&quot;section&quot;:&quot;Display&quot;}}">
class Component extends DCLogic {
  DOCS = [
    {id:'d1',name:'Dr. Farhana Rahman',bn:'ডা. ফারহানা রহমান',dept:'Medicine · মেডিসিন',room:'201',pre:'M',now:12,max:17,state:'in'},
    {id:'d2',name:'Dr. Tanvir Hasan',bn:'ডা. তানভীর হাসান',dept:'Medicine · মেডিসিন',room:'202',pre:'N',now:0,max:13,state:'notyet',start:'11:00 am',startBn:'১১:০০'},
    {id:'d3',name:'Dr. Nusrat Jahan',bn:'ডা. নুসরাত জাহান',dept:'Cardiology · কার্ডিওলজি',room:'305',pre:'C',now:8,max:11,state:'in'},
    {id:'d5',name:'Dr. Sharmin Akter',bn:'ডা. শারমিন আক্তার',dept:'Gynae & Obs · স্ত্রীরোগ',room:'210',pre:'G',now:5,max:9,state:'in'},
    {id:'d7',name:'Dr. Selina Parvin',bn:'ডা. সেলিনা পারভীন',dept:'ENT · নাক-কান-গলা',room:'118',pre:'E',now:3,max:9,state:'in'},
    {id:'d4',name:'Dr. Mahbub Alam',bn:'ডা. মাহবুব আলম',dept:'Paediatrics · শিশু রোগ',room:'108',pre:'P',now:15,max:15,state:'done'}
  ];
  state = { now:Object.fromEntries(this.DOCS.map(d=>[d.id,d.now])), flash:null, t:new Date(2026,10,19,10,36,0).getTime() };
  componentDidMount(){
    this._lang=setInterval(()=>this.setState(s=>({bn:!s.bn})),8000);
    this._clock=setInterval(()=>this.setState(s=>({t:s.t+1000})),1000);
    this._adv=setInterval(()=>{
      if(this.props.offline||this.props.autoAdvance===false) return;
      const live=this.DOCS.filter(d=>d.state==='in'&&this.state.now[d.id]<d.max);
      if(!live.length) return;
      const d=live[Math.floor(Math.random()*live.length)];
      this.setState(s=>({now:{...s.now,[d.id]:s.now[d.id]+1},flash:d.id}));
      clearTimeout(this._f); this._f=setTimeout(()=>this.setState({flash:null}),5000);
    },9000);
  }
  componentWillUnmount(){ clearInterval(this._clock); clearInterval(this._adv); clearTimeout(this._f); clearInterval(this._lang); }
  tok(d,n){ return d.pre+'-'+String(n).padStart(2,'0'); }
  renderVals(){
    const offline=!!this.props.offline, showNotice=this.props.showNotice!==false;
    const dt=new Date(this.state.t), h=dt.getHours(), m=dt.getMinutes();
    const clock=(((h+11)%12)+1)+':'+String(m).padStart(2,'0')+(h<12?' am':' pm');
    const cards=this.DOCS.map(d=>{
      const n=this.state.now[d.id], fl=this.state.flash===d.id;
      const next=[]; if(d.state!=='done') for(let i=1;i<=3;i++){ const k=(d.state==='notyet'?0:n)+i; if(k<=d.max) next.push({t:this.tok(d,k)}); }
      const B=!!this.state.bn, t=(e,b)=>B?b:e;
      let label=t('NOW SERVING','এখন সেবা দেওয়া হচ্ছে'), token=this.tok(d,n), sub=fl?t('Please go to Room '+d.room,'রুম '+d.room+'-এ যান'):t('Please wait for your token','টোকেন নম্বরের জন্য অপেক্ষা করুন'), tokenC='#FF8000', labelC='#7CC8F0';
      if(d.state==='notyet'){ label=t('DOCTOR NOT ARRIVED','ডাক্তার এখনো আসেননি'); token='—'; sub=t('OPD starts '+d.start,d.startBn+' টায় শুরু'); tokenC='#4F7894'; labelC='#9FC3DA'; }
      if(d.state==='done'){ label=t('OPD FINISHED','আজকের মতো শেষ'); sub=t('Last token '+this.tok(d,n),'শেষ টোকেন '+this.tok(d,n)); token='✓'; tokenC='#4F7894'; labelC='#9FC3DA'; }
      if(offline) sub=t('Waiting for connection','সংযোগের অপেক্ষায়');
      const dp=d.dept.split(' · '); return {...d,nm:B?d.bn:d.name,sub2:B?dp[1]:dp[0],label,token,sub,tokenC,labelC,bd:fl&&!offline?'#FF8000':'#0B3B5E',next,noNext:next.length===0};
    });
    const B=!!this.state.bn; const msg=(this.props.noticeText||(B?'শুক্রবার ২০ নভেম্বর ওপিডি বন্ধ।   ●   ২৮ নভেম্বর শনিবার সকাল ৯টা–১টা বিনামূল্যে ডায়াবেটিস ও রক্তচাপ পরীক্ষা ক্যাম্প।   ●   অনুগ্রহ করে টোকেন স্লিপ সাথে রাখুন।':'Friday 20 Nov: OPD closed (weekly holiday).   ●   Free diabetes & BP camp on Sat 28 Nov, 9 am–1 pm, ground floor.   ●   Please keep your token slip with you.'))+'   ●   ';
    const span=k=>React.createElement('span',{key:k,style:{paddingRight:'4vw',whiteSpace:'nowrap'}},msg);
    const ticker=React.createElement('div',{style:{display:'flex',whiteSpace:'nowrap',fontSize:'clamp(14px,1.45vw,29px)',fontWeight:600,color:'#fff',animation:'tvTicker 45s linear infinite'}},[span(1),span(2)]);
    const pulseDot=React.createElement('span',{style:{width:'1vw',height:'1vw',minWidth:10,minHeight:10,borderRadius:99,background:'#7A0000',animation:'tvPulse 1.2s ease-in-out infinite'}});
    const L=B?{offline:'সংযোগ বিচ্ছিন্ন — আবার চেষ্টা করা হচ্ছে…',lastUpd:'সর্বশেষ আপডেট ১০:৩৪',hosp:'পপুলার হসপিটাল',queue:'বহির্বিভাগ সিরিয়াল',date:'বৃহস্পতিবার, ১৯ নভেম্বর ২০২৬',room:'রুম',next:'পরবর্তী',notice:'নোটিশ'}:{offline:'Connection lost — reconnecting…',lastUpd:'Last update 10:34 am',hosp:'Popular Hospital',queue:'OPD Queue',date:'Thursday, 19 Nov 2026',room:'ROOM',next:'Next',notice:'NOTICE'};
    return {L,offline,showNotice,clock,cards,ticker,pulseDot,dim:offline?'.55':'1'};
  }
}

</script>
</body>
</html>
